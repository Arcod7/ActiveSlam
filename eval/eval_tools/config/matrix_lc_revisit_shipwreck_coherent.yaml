# Same scene/pose as matrix_lc_revisit_shipwreck_2seed.yaml (config.yaml,
# motion:=walloriented), same seeds -- but with odom_coherent_noise:=true and
# sigma_allow_xy_m bumped from 0.2 to 0.45 (roughly the mid-growth point seen
# in coherent_noise_ab_20260730_1126's sigma_xy(t) curves) so the revisit
# trigger has a chance to actually fire instead of never crossing the old
# flat ~0.1m accounting. Exploratory value, not a tuned threshold -- lc_revisit
# at 20260730_2259 got revisit_count=0 for both seeds with this off.
batch_name: lc_revisit_shipwreck_coherent
duration_s: 300
settle_s: 15
seeds:
- 601
- 602
record_bag: false
common_args:
  rviz: 'false'
  noise_profile_dvl: degraded
  sigma_allow_xy_m: 0.45
  sigma_allow_yaw_rad: 0.05
  revisit_min_closures: 1
  arrival_dwell_s: 6.0
  turn_factor: 0.5
  motion: walloriented
  safety_start_enabled: 'true'
  wall_orientation_offset_deg: 45.0
  wall_orientation_lookahead_m: 2.0
  mapper: tsdf
  directional_tsdf: 'true'
  noise_profile_sonar: realistic_no_reverb
  voxel_min_solid_confidence: 0.7
  voxel_min_weight: 6.0
  map_rebuild: 'true'
  mode: frontier
  tsdf_frontier_standoff_m: 2.0
  hard_inflation_m: 0.5
  plan_inflation_m: 5.0
  scene: target
  obj_mesh: shipwreck.obj
  obj_x: 4.55
  obj_y: -20.62
  obj_z: 18.38
  obj_scale: 0.85
  obj_pitch: -180.0
  obj_yaw: 15.0
  robot_x: -2.9977
  robot_y: -1.5461
  robot_z: 6.9393
  robot_roll: -0.1439
  robot_pitch: 0.0955
  robot_yaw: 150.1176
  slam: slam
  loop_closure: 'true'
  revisit: 'true'
  odom_coherent_noise: 'true'
runs:
- name: lc_revisit_coherent
  args: {}
