# Does triggering revisits on uncertainty beat triggering on a clock, once the
# uncertainty is actually calibrated?
#
# This repeats the trigger comparison with the corrected odometry model. The
# earlier version of this experiment could not answer the question: sigma_xy
# was 6-10x under the true drift, so U_r was not a measurement of anything, and
# the threshold had been raised to 0.45 to make the trigger fire at all -- its
# own config comment says so.
#
# sigma_allow is now derived from a mission requirement, fixed before any
# outcome was inspected, and NOT from the observed sigma_xy curves:
#
#   sigma_allow_xy_m = voxel_size = 0.2
#     The deliverable is a 0.2 m TSDF reconstruction. Once the pose uncertainty
#     exceeds one voxel, a measurement can be integrated into the wrong voxel
#     and the resolution the map claims is no longer supported.
#
#   sigma_allow_yaw_rad = voxel_size / mapping_range = 0.2 / 4.0 = 0.05
#     Heading uncertainty smears a surface laterally by psi * range. At the
#     typical mapping range for this survey (wall_standoff 1.5 m plus the
#     frontier standoff 2.0 m, so ~4 m to the far side of what a sweep sees),
#     one voxel of smear is 0.05 rad.
#
# Both arms are given the same revisit machinery and differ only in what starts
# a revisit, so the comparison isolates the trigger and nothing else.
#
# RE-MATCH PASS. The 34 m schedule in trigger_powered_20260731_1147 realised
# 2.31 revisits per run against the uncertainty arm's 3.62, because cutting
# cooldown to 30 s let U_r re-trigger sooner while the schedule kept counting
# only exploring-state travel -- realised spacing 52.4 m against a 34 m
# setting. An unmatched cadence makes the comparison measure revisit frequency,
# which is exactly what the control exists to remove, so the scheduled arm is
# re-run at 34 * 2.31/3.62 = 22 m and paired against the SAME uncertainty runs.
# The interval is calibrated to equalise revisit count, which is the definition
# of this control, not a tuning of the outcome.
#
# The schedule interval is a MATCHED CADENCE, not a free parameter: if the two
# arms revisit a different number of times the comparison measures revisit
# frequency rather than what triggered them. It is the travel at which U_r
# itself reaches 1 under dead reckoning alone, measured on the closure-free
# calibration batch (odom_calibration_20260731_0935): 51.4, 34.2 and 26.7 m of
# arc on three seeds, median 34.
#
# cooldown_s is 30, not the 60 s default. Measured on the first four paired
# seeds, a 300 s run with ~3 revisits spent 41-60% of itself in cooldown with
# the trigger suppressed, and exploring fell as low as 17%. That compresses any
# difference between the two trigger policies and is a large part of why the
# n=4 comparison had no power. Not comparable with those four seeds.
#
# Revisits end on revisit_min_closures=1, i.e. on achieving the relocalisation
# they were launched for, not on U_r falling back under ratio_resume. Measured:
# 9 of 10 revisit exits were CLOSED and one was RESUMED_DOPT, with U_r at exit
# between 0.34 and 0.76. U_r < 0.5 needs sigma_xy < 0.175 m once the yaw factor
# of 0.60 is applied, which a single closure does not deliver, so ratio_resume
# is close to inactive by construction. The honest description of this policy is
# that U_r decides when to GO and a closure decides when to STOP.
#
# Note this is NOT where sigma_xy crosses sigma_allow_xy (11.7-14.3 m). U_r
# factorises as r_xy^(4/3) * r_yaw^(2/3), and sigma_yaw sits at ~0.023 rad
# against an allowance of 0.05, so the yaw factor is 0.60 and the effective
# position trigger is sigma_xy = 0.295 m rather than 0.2 m. A comfortably low
# yaw ratio dilutes the position trigger -- worth stating, because it means
# sigma_allow_yaw_rad silently rescales the position threshold.
