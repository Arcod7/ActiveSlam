# Map-backend ladder -- OctoMap, plain TSDF, directional TSDF -- on the full
# system (loop closure + uncertainty-driven revisits), 10 paired seeds.
#
# Derived key-for-key from matrix_ladder10.yaml so the arms stay comparable
# with that batch; only the mapper backend varies per arm. The dtsdf arm is
# configured identically to ladder10's lc_revisit arm on the same seeds, so if
# the code is unchanged it doubles as a same-config repeat measurement of that
# arm across batches.
#
# TSDF-only keys (carving, tsdf_octomap, cache, standoff) are inert under
# mapper: octomap; they are kept in common_args so the tsdf arms match
# ladder10 exactly.
#
# iou_occ is computed only on the octomap path today; the tsdf arms rely on
# coverage/chamfer until the offline IoU recompute lands.
batch_name: mapper_ladder
duration_s: 720
settle_s: 15
seeds:
- 900
- 901
- 902
- 903
- 904
- 905
- 906
- 907
- 908
- 909
record_bag: true
common_args:
  slam: slam
  loop_closure: 'true'
  revisit: 'true'
  noise_profile_dvl: realistic
  noise_profile_imu: realistic
  noise_profile_compass: realistic
  noise_profile_pressure: realistic
  keyframe_dist_m: 1.0
  keyframe_angle_rad: 0.25
  keyframe_max_per_cell: 3
  loop_closure_radius_m: 5.0
  loop_closure_min_gap: 20
  min_inlier_ratio: 0.3
  noise_profile: realistic
  scan_sigma_trans: 0.12
  scan_sigma_rot: 0.08
  odom_sigma_trans: 0.002
  odom_sigma_rot: 0.02
  odom_coherent_noise: 'true'
  sigma_allow_xy_m: 0.12
  sigma_allow_yaw_rad: 0.05
  ratio_trigger: 1.0
  ratio_resume: 0.4
  revisit_min_closures: 0
  arrival_dwell_s: 16.0
  stall_exit_s: 5.0
  revisit_scan_slowdown: 1.0
  speed_factor: 2.0
  turn_factor: 0.8
  depth: 6.5
  motion: walloriented
  scan_style: sweep
  scan_sweep_deg: 180.0
  safety_start_enabled: 'true'
  wall_orientation_offset_deg: 45.0
  wall_orientation_lookahead_m: 2.5
  wall_yaw_only: 'true'
  wall_standoff: 3.0
  wall_max_surface_dist: 0.0
  wall_switch_goal_distance: 6.0
  wall_switch_scan_angle: 3.14159
  wall_switch_scan_yaw: 0.08
  wall_path_influence: 0.1
  wall_path_look_offset_deg: 0.0
  wall_normal_offset_deg: 0.0
  wall_path_heading_weight: 0.1
  noise_profile_sonar: realistic_no_reverb
  voxel_size: 0.25
  trunc_distance: 0.0
  space_carving: 'true'
  carve_no_return: 'true'
  voxel_min_solid_confidence: 0.7
  voxel_min_weight: 6.0
  tsdf_octomap: 'true'
  map_rebuild: 'true'
  cache_max_scans: 6000
  mode: frontier
  tsdf_frontier_standoff_m: 5.5
  survey_radius_m: 0.0
  goal_radius_m: 3.0
  min_goal_separation_m: 0.0
  arrival_blacklist_duration_s: 60.0
  blacklist_duration_s: 60.0
  projected_map_band_m: 0.75
  hard_inflation_m: 1.0
  inflation_m: 2.0
  plan_inflation_m: 6.0
  scene: target
  obj_mesh: shipwreck.obj
  obj_x: 4.55
  obj_y: -20.62
  obj_z: 18.38
  obj_scale: 0.85
  obj_roll: 0.0
  obj_pitch: -180.0
  obj_yaw: 15.0
  robot_x: -6.9977
  robot_y: 0.9539
  robot_z: 6.9393
  robot_roll: -0.1439
  robot_pitch: 0.0955
  robot_yaw: 150.1176
  rviz: 'false'
  scenario: none
  scenario_out_dx: 15.0
  scenario_out_dy: 0.0
  rpe_delta: 1.0
runs:
- name: octomap
  args:
    mapper: octomap
- name: tsdf
  args:
    mapper: tsdf
    directional_tsdf: 'false'
- name: dtsdf
  args:
    mapper: tsdf
    directional_tsdf: 'true'
