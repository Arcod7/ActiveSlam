# Does the corrected odometry uncertainty model describe the drift the
# pipeline actually produces?
#
# Loop closure, revisit and map rebuild are all OFF. That is deliberate: a
# closure resets both the error and the marginal, so with closures on you are
# measuring the closure model, not the odometry model. This is the only
# configuration in which sigma_xy is a pure statement about dead reckoning.
#
# Scene, object pose and spawn come from config.yaml (the live source of
# truth), with motion:=walloriented rather than the config's walllooking --
# the robot spawns ~23 m out and walllooking needs a wall already in view,
# which deadlocks every run at zero travel.
#
# Eight seeds because per-run consistency statistics are worthless here: the
# DVL scale and bias are one draw per run, so a whole trace is dominated by a
# single realisation. Read the output with consistency_report.py, which pools
# one sample per seed at each distance milestone.
batch_name: odom_calibration
duration_s: 300
settle_s: 15
seeds:
- 701
- 702
- 703
- 704
- 705
- 706
- 707
- 708
record_bag: false
common_args:
  rviz: 'false'
  safety_start_enabled: 'true'
  slam: slam
  loop_closure: 'false'
  revisit: 'false'
  map_rebuild: 'false'
  odom_coherent_noise: 'true'
  noise_profile: realistic
  noise_profile_imu: realistic
  noise_profile_compass: realistic
  noise_profile_pressure: realistic
  keyframe_dist_m: 0.5
  keyframe_angle_rad: 0.2
  keyframe_max_per_cell: 3
  min_inlier_ratio: 0.3
  scan_sigma_trans: 0.12
  scan_sigma_rot: 0.08
  odom_sigma_trans: 0.002
  odom_sigma_rot: 0.02
  speed_factor: 1.0
  turn_factor: 0.5
  depth: 8.0
  motion: walloriented
  scan_style: sweep
  scan_sweep_deg: 180.0
  thrust_boost: 'false'
  wall_orientation_offset_deg: 45.0
  wall_orientation_lookahead_m: 2.0
  wall_z_band_m: 1.5
  wall_standoff: 1.5
  wall_switch_goal_distance: 6.0
  wall_switch_scan_angle: 3.14159
  wall_switch_scan_yaw: 0.08
  wall_path_influence: 0.7
  wall_path_look_offset_deg: 30.0
  wall_normal_offset_deg: 0.0
  wall_path_heading_weight: 0.35
  mapper: tsdf
  directional_tsdf: 'true'
  noise_profile_sonar: realistic_no_reverb
  near_cutoff: 1.6
  near_fade: 0.8
  voxel_size: 0.2
  trunc_distance: 0.0
  space_carving: 'true'
  carve_no_return: 'false'
  voxel_min_solid_confidence: 0.7
  voxel_min_weight: 6.0
  tsdf_octomap: 'true'
  cache_max_scans: 6000
  mode: frontier
  tsdf_frontier_standoff_m: 2.0
  survey_radius_m: 0.0
  min_goal_separation_m: 0.0
  projected_map_band_m: 1.0
  hard_inflation_m: 0.5
  inflation_m: 1.5
  plan_inflation_m: 5.0
  scene: target
  obj_mesh: shipwreck.obj
  obj_x: 4.55
  obj_y: -20.62
  obj_z: 18.38
  obj_scale: 0.85
  obj_roll: 0.0
  obj_pitch: -180.0
  obj_yaw: 15.0
  robot_x: -2.9977
  robot_y: -1.5461
  robot_z: 6.9393
  robot_roll: -0.1439
  robot_pitch: 0.0955
  robot_yaw: 150.1176
runs:
- name: dvl_degraded
  args:
    noise_profile_dvl: degraded
