# Dependency manifest for bootstrap.sh. Git submodules are pinned by their
# gitlinks; the hashes below document the intended pins beside their upstream
# repository. Keep this file and .gitmodules/gitlinks in sync when upgrading.

STONEFISH_REPOSITORY="https://github.com/Arcod7/stonefish.git"
STONEFISH_GITLINK="578db01ffec3c5805bf1943900fbda183ebe5e94"
STONEFISH_ROS2_REPOSITORY="https://github.com/Arcod7/stonefish_ros2.git"
STONEFISH_ROS2_GITLINK="ca2d510f068b5cf27de0f697ddd8081f3f88a525"
STONEFISH_ROS2_PATCH_DIR="sim/stonefish_ros2_patches"
VDBFUSION_REPOSITORY="https://github.com/PRBonn/vdbfusion.git"
VDBFUSION_GITLINK="1b22ae8d38db2faab00e9036bef497ddd5f3e377"
# Wheel release used first. Upstream publishes x86_64 only, up to CPython 3.10,
# so Humble on x86_64 takes the wheel and aarch64 or 3.11+ builds the submodule.
VDBFUSION_WHEEL_VERSION="0.1.6"
OPEN3D_REPOSITORY="https://github.com/isl-org/Open3D.git"
OPEN3D_GITLINK="1e7b17438687a0b0c1e5a7187321ac7044afe275"

GTSAM_SUBMODULE_PATH="external/gtsam"
GTSAM_REPOSITORY="https://github.com/borglab/gtsam.git"
GTSAM_SOURCE_REF="4.2.0"
GTSAM_GITLINK="4f66a491ffc83cf092d0d818b11dc35135521612"
# Wheel release used first. 4.3a0 is the only one publishing aarch64 wheels for
# both CPython 3.10 (Humble) and 3.12 (Jazzy); the source pin above is the
# fallback for interpreters no wheel matches.
GTSAM_WHEEL_VERSION="4.3a0"
